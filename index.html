<!DOCTYPE html>

<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Check-In</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
font-family:Arial;
text-align:center;
padding:20px;
}

#reader{
width:320px;
margin:auto;
}

#result{
margin-top:20px;
font-size:22px;
font-weight:bold;
}
</style>

</head>

<body>

<h2>📷 مسح الدعوة</h2>

<div id="reader"></div>

<div id="result"></div>

<script>

function onScanSuccess(decodedText){

document.getElementById("result").innerHTML =
"⏳ جاري التحقق...";

window.location.href =
"https://script.google.com/macros/s/AKfycbzetVc1h9uFz6CrqToUwQcNZwFFG-dkyxtn_C2S4vn2c4wTjIPzFS9Fyh6Mnv7gXK8/exec?id="
+ encodeURIComponent(decodedText);

}

let html5QrcodeScanner =
new Html5QrcodeScanner(
"reader",
{
fps:10,
qrbox:250
}
);

html5QrcodeScanner.render(onScanSuccess);

</script>

</body>
</html>
